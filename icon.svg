<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1a0a2e"/>
  
  <!-- Cat body -->
  <ellipse cx="256" cy="340" rx="110" ry="90" fill="#f5e6c8"/>
  
  <!-- Cat head -->
  <circle cx="256" cy="210" r="95" fill="#f5e6c8"/>
  
  <!-- Left ear outer -->
  <polygon points="145,145 168,88 205,148" fill="#f5e6c8"/>
  <!-- Left ear inner -->
  <polygon points="155,140 172,102 200,143" fill="#ffb7c5"/>
  
  <!-- Right ear outer -->
  <polygon points="367,145 344,88 307,148" fill="#f5e6c8"/>
  <!-- Right ear inner -->
  <polygon points="357,140 340,102 312,143" fill="#ffb7c5"/>
  
  <!-- Japan flag circle on body -->
  <circle cx="256" cy="335" r="52" fill="white"/>
  <circle cx="256" cy="335" r="28" fill="#bc002d"/>
  
  <!-- Eyes -->
  <ellipse cx="222" cy="200" rx="16" ry="18" fill="#2d1b4e"/>
  <ellipse cx="290" cy="200" rx="16" ry="18" fill="#2d1b4e"/>
  <!-- Eye shine -->
  <circle cx="228" cy="194" r="5" fill="white"/>
  <circle cx="296" cy="194" r="5" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="256" cy="226" rx="8" ry="6" fill="#ffb7c5"/>
  
  <!-- Mouth -->
  <path d="M248 232 Q256 242 264 232" stroke="#c9956b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers left -->
  <line x1="170" y1="220" x2="238" y2="228" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  <line x1="168" y1="232" x2="238" y2="232" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="244" x2="238" y2="236" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Whiskers right -->
  <line x1="342" y1="220" x2="274" y2="228" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  <line x1="344" y1="232" x2="274" y2="232" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="244" x2="274" y2="236" stroke="#a08060" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="200" cy="235" rx="18" ry="10" fill="#ffb7c5" opacity="0.5"/>
  <ellipse cx="312" cy="235" rx="18" ry="10" fill="#ffb7c5" opacity="0.5"/>
  
  <!-- Paws -->
  <ellipse cx="185" cy="415" rx="38" ry="28" fill="#f5e6c8"/>
  <ellipse cx="327" cy="415" rx="38" ry="28" fill="#f5e6c8"/>
  <!-- Paw toes left -->
  <ellipse cx="165" cy="408" rx="10" ry="7" fill="#f0dab8"/>
  <ellipse cx="183" cy="403" rx="10" ry="7" fill="#f0dab8"/>
  <ellipse cx="202" cy="408" rx="10" ry="7" fill="#f0dab8"/>
  <!-- Paw toes right -->
  <ellipse cx="307" cy="408" rx="10" ry="7" fill="#f0dab8"/>
  <ellipse cx="325" cy="403" rx="10" ry="7" fill="#f0dab8"/>
  <ellipse cx="344" cy="408" rx="10" ry="7" fill="#f0dab8"/>
  
  <!-- Tail -->
  <path d="M366 390 Q430 350 420 290 Q415 265 395 275 Q385 280 390 300 Q400 330 355 370" fill="#f5e6c8"/>
  
  <!-- Small stars -->
  <text x="80" y="100" font-size="28" opacity="0.6">⭐</text>
  <text x="390" y="95" font-size="22" opacity="0.5">✨</text>
  <text x="68" y="390" font-size="18" opacity="0.4">✨</text>
</svg>
